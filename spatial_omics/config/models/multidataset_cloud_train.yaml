output_dir: outputs/active/multidataset_cloud_train
run_models:
  - graphsage
  - toponet_hodge
materialized_data_root: outputs/active/multidataset_cloud_train/prepared
fail_on_missing_required: true
fail_on_model_error: true
strict_preflight: true
auto_cap_splits: true
emit_dataset_state: true
preflight_only: false
random_state: 42
n_splits: 4
n_repeats: 1
batch_size: 12
epochs: 12
patience: 4
learning_rate: 0.001
weight_decay: 0.00005
knn_k: 6
neighborhood_mode: adaptive_knn
model_dim: 48
type_embedding_dim: 16
max_cells: 160
dropout: 0.15
focal_gamma: 2.0
label_smoothing: 0.0
threshold_grid_size: 61
temperature: 0.5
blend_with_engineered: false
num_layers: 2
polynomial_order: 2
restriction_hidden_dim: 32
use_geometric_weights: false
use_orthogonal_restrictions: false
use_morse_gating: false
global_knn_multiplier: 4
global_distance_multiplier: 2.5
global_max_neighbors: 24
